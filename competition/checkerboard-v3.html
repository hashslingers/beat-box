<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkerboard Neck — variants</title>
<style>
  :root{
    --paper:#F4F2ED; --ink:#111110; --line:#111110; --tint:#EAE7E0;
    --salmon:#FA8763; --ghost:#B9B5AC; --note:#6B6864;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --cellW:62px; --cellH:58px; --labelW:42px;
    --gap:5px; --chord:#111110; --color:#111110; --colorHatch:0;
    --neckbg:#F4F2ED;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#26241f;font-family:var(--sans);-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .stage{background:var(--paper);color:var(--ink);border:2px solid var(--ink);width:max-content}
  .top{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:2px solid var(--ink)}
  .title{font-weight:900;font-size:16px;letter-spacing:.02em;text-transform:uppercase}
  .title small{display:block;font-size:8.5px;letter-spacing:.26em;color:var(--note);font-weight:700;margin-top:2px}
  .tag{margin-left:8px;font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
       border:2px solid var(--ink);padding:3px 7px}
  .spacer{flex:1}
  .posn{font-weight:900;font-size:13px} .posn small{color:var(--note);font-size:9px;letter-spacing:.15em}
  .board{padding:9px 15px 3px;background:var(--neckbg)}
  .grid{display:grid;grid-template-columns:var(--labelW) repeat(13,var(--cellW));grid-auto-rows:var(--cellH);
        border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
  .lbl{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;
       border-right:2px solid var(--ink);border-bottom:1px solid var(--line)}
  .cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell.fret0{border-right:3px solid var(--ink)}
  .cell.checker{background:var(--tint)}
  .cell .fill{position:absolute;inset:var(--gap)}
  .cell.chord .fill{background:var(--chord)}
  .cell.color .fill{background:var(--color)}
  .cell.root  .fill{background:var(--salmon);border:2px solid var(--ink)}
  .cell.root  .fill::after{content:"";position:absolute;inset:38%;background:var(--ink)}
  .cell.ghost .fill{background:transparent;border:1.5px solid var(--ghost);inset:12px}
  .cell.bridge .fill{outline:2.5px dashed var(--salmon);outline-offset:2px}
  .ruler{display:grid;grid-template-columns:var(--labelW) repeat(13,var(--cellW));margin-top:5px;background:var(--neckbg)}
  .ruler span{text-align:center;font-size:10.5px;font-weight:700;color:var(--note)}
  .ruler span.dot{color:var(--ink)}
  .legend{display:flex;gap:15px;align-items:center;padding:9px 15px 12px;flex-wrap:wrap}
  .legend i{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--note)}
  .legend b{width:16px;height:16px;border:1.5px solid var(--ink);display:inline-block}
  .legend b.r{background:var(--salmon)} .legend b.c{background:var(--chord)} .legend b.t{background:var(--color)}
  .legend b.g{border:1.5px solid var(--ghost);background:transparent}

  /* hatch util for color tones (variant A) */
  .hatch .cell.color .fill{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 7px)!important}

  /* ---- Variant A: PURE — all in-position solid, only root salmon, faint board ---- */
  [data-v="A"]{--tint:#F0EDE7;--color:var(--ink);--chord:var(--ink)}
  /* ---- Variant B: FULL-BLEED blocks, strong board ---- */
  [data-v="B"]{--gap:0px;--tint:#E2DED5;--color:var(--ink);--chord:var(--ink)}
  [data-v="B"] .cell.root .fill{border:3px solid var(--ink)}
  /* ---- Variant C: SHADE RAMP — degree by brightness (one ink family) ---- */
  [data-v="C"]{--tint:#F0EDE7;--chord:#16150f;--color:#9C988F}
  /* ---- Variant D: DARK NECK — lit cells glow on a dark board ---- */
  [data-v="D"]{--paper:#15140F;--neckbg:#15140F;--ink:#ECE7DB;--line:#3A382F;--tint:#1E1C16;
               --note:#8C887C;--ghost:#4A4840;--chord:#ECE7DB;--color:#6E6B60}
  [data-v="D"] .stage{border-color:#3A382F}
  [data-v="D"] .cell.root .fill{background:var(--salmon);border:2px solid #15140F}
  [data-v="D"] .cell.root .fill::after{background:#15140F}
</style>
</head>
<body>
<div class="stage" id="stage" data-v="A">
  <div class="top">
    <div class="title">Checkerboard Neck<small>G MAJOR · POSITION MAP</small></div>
    <span class="tag" id="tag">A · PURE</span>
    <div class="spacer"></div>
    <div class="posn" id="posn">CAGED · POS 1 <small>/ 5</small></div>
  </div>
  <div class="board"><div class="grid" id="grid"></div><div class="ruler" id="ruler"></div></div>
  <div class="legend">
    <i><b class="r"></b>Root</i><i><b class="c"></b>Chord tone</i><i><b class="t"></b>Color tone</i>
    <i><b class="g"></b>Neighbour</i><i><span style="color:var(--salmon);font-weight:900">▟▙</span>Bridge</i>
  </div>
</div>
<script>
const OPEN=[{n:'E',midi:40},{n:'A',midi:45},{n:'D',midi:50},{n:'G',midi:55},{n:'B',midi:59},{n:'e',midi:64}];
const MAJOR=[0,2,4,5,7,9,11]; const FRETS=12; const ROOT_PC=7;
function scaleCells(){const inS=new Set(MAJOR.map(s=>(ROOT_PC+s)%12));const out=[];OPEN.forEach((st,si)=>{for(let f=0;f<=FRETS;f++){const midi=st.midi+f,pc=midi%12;if(inS.has(pc)){const degree=MAJOR.indexOf(((pc-ROOT_PC)%12+12)%12)+1;out.push({s:si,f,degree});}}});return out;}
function positionWindow(idx){const root=((ROOT_PC-40)%12+12)%12;const lo=root+idx*3;return{lo,hi:lo+4};}
const CELLS=scaleCells(), ROWS=[5,4,3,2,1,0], LBL={5:'e',4:'B',3:'G',2:'D',1:'A',0:'E'};
const inW=(f,w)=>f>=w.lo&&f<=w.hi;
function build(pos){
  const g=document.getElementById('grid');g.innerHTML='';
  const aw=positionWindow(pos),pw=pos>0?positionWindow(pos-1):null,nw=pos<4?positionWindow(pos+1):null;
  ROWS.forEach(si=>{
    const l=document.createElement('div');l.className='lbl';l.textContent=LBL[si];g.appendChild(l);
    for(let f=0;f<=FRETS;f++){
      const c=document.createElement('div');
      c.className='cell'+(f===0?' fret0':'')+(((si+f)%2)?' checker':'');
      const n=CELLS.find(x=>x.s===si&&x.f===f);
      if(n){const act=inW(f,aw),nb=(pw&&inW(f,pw))||(nw&&inW(f,nw));
        if(act){const fl=document.createElement('div');fl.className='fill';
          c.classList.add(n.degree===1?'root':([1,3,5,7].includes(n.degree)?'chord':'color'));
          if(nb)c.classList.add('bridge');c.appendChild(fl);}
        else if(nb){c.classList.add('ghost');const fl=document.createElement('div');fl.className='fill';c.appendChild(fl);}}
      g.appendChild(c);
    }
  });
  const r=document.getElementById('ruler');r.innerHTML='<span></span>';const d=new Set([3,5,7,9,12]);
  for(let f=0;f<=FRETS;f++){const s=document.createElement('span');s.textContent=f;if(d.has(f))s.className='dot';r.appendChild(s);}
}
const V=new URLSearchParams(location.search).get('v')||'A';
const TAGS={A:'A · HATCH',B:'B · SOLID BLOCKS',C:'C · SHADE RAMP',D:'D · DARK NECK'};
const stage=document.getElementById('stage');stage.dataset.v=V;document.getElementById('tag').textContent=TAGS[V]||V;
if(V==='A')stage.classList.add('hatch'); // A keeps color tones as hatch so root+chord stay pure-solid
build(0);
</script>
</body>
</html>
